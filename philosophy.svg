<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&amp;display=swap');
    .text {
      font-family: 'EB Garamond', serif;
      fill: #FFFFFF;
      text-anchor: middle;
    }
    .headline { font-size: 48px; font-weight: 500; }
    .body { font-size: 20px; fill: #86868b; line-height: 1.4; }
    .highlight { fill: #FFFFFF; font-weight: 600; }
  </style>
  
  <text x="400" y="45" class="text headline">Simplicity is the focus.</text>
  
  <text x="400" y="90" class="text body">I don't just write code. I craft digital experiences where every</text>
  <text x="400" y="115" class="text body">pixel has a purpose and every interaction feels intentional.</text>
  <text x="400" y="140" class="text body">Obsessed with the intersection of <tspan class="highlight">Art</tspan> and <tspan class="highlight">Engineering</tspan>.</text>
</svg>
